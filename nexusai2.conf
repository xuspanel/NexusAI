# ==========================================================================
# NEXUS AI - PRODUCTION NGINX CONFIGURATION
# Location: /etc/nginx/conf.d/nexusai2.conf
# Domain: nx.xus.me | VPS IP: 173.249.63.112 | Path: /opt/nexusai
# ==========================================================================

# HTTP Server (Port 80)
server {
    listen 80;
    listen [::]:80;
    server_name nx.xus.me 173.249.63.112 localhost 127.0.0.1;

    root /opt/nexusai/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # High-Speed Express SSE Stream & API Reverse Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:3005/api/;
        proxy_http_version 1.1;

        # Disable buffering for real-time Ollama token streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts for heavy LLM generations
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Direct API route match fallback
    location /api {
        proxy_pass http://127.0.0.1:3005/api;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Single Page Application Frontend Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS Server (Port 443) - SSL for nx.xus.me
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nx.xus.me;

    ssl_certificate     /etc/letsencrypt/live/nx.xus.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nx.xus.me/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /opt/nexusai/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # High-Speed Express SSE Stream & API Reverse Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:3005/api/;
        proxy_http_version 1.1;

        # Disable buffering for real-time Ollama token streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts for heavy LLM generations
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Direct API route match fallback
    location /api {
        proxy_pass http://127.0.0.1:3005/api;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Single Page Application Frontend Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
